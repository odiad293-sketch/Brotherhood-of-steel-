<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="styles/dashboard/updates.css">
  <link rel="stylesheet" href="styles/dashboard/sidebar.css">
  <link rel="stylesheet" href="styles/dashboard/header.css">
  <link rel="stylesheet" href="styles/search/search.css">
</head>

<body>
  
  <header>
    
    <div class="left-component">
      
      <button class="icon-container js-sidebar-btn">
        <span class=" js-sidebar-icon red-icons material-symbols-outlined">
          menu
        </span>
      </button>
      
      <div class="logo-container">
        
        <img src="images/BHOS-log.png" alt="logo" class="logo-image" />
        
        <div class="alliance-name">
          <p>BROTHERHOOD OF STEEL</p>
        </div>
        
      </div>
      
    </div>
    
    
    <div class="right-component">
      
      <button class="search-button">
        <span class="White-icons material-symbols-outlined">
          search
        </span>
      </button>
      
      
      <button class="icon-container notification-container">
      
        <span class="White-icons material-symbols-outlined">
          notifications
        </span>
        
        <div class="notification-badge">
          3
        </div>
        
      </button>
      
    </div>
    
  </header>
  
  <main>
    <div class="search-introduction">
      <div class="container-search-icon">
        <span class="search-icon material-symbols-outlined">
          search
        </span>
      </div>
      <div class="intro-search-bar">
        <p>ALLIANCE SEARCH</p>
        <div class="page-function-info">
          Search members, nations, pages and more across the alliance.
        </div>
      </div>
    </div>
    <div class="main-search-bar">
      <div class="search-bar">
        <span class="search-icon material-symbols-outlined">
          search
        </span>
        <input class="search" type="text" placeholder="Search the alliance..." />
      </div>
    </div>
    
    <div class="category-container">
      <p>PICK CATEGORIES</p>
      
      <div class="main-cate-container">
        
        <button class="categories-card">
          <span class="search-icon material-symbols-outlined">
            language
          </span>
          <div class="categories-names">
            NATIONS
          </div>
          <div class="categories-info">
            Search nations
          </div>
        </button>
        
        <button class="categories-card">
          <span class="search-icon material-symbols-outlined">
            groups
          </span>
          <div class="categories-names">
            MEMBERS
          </div>
          <div class="categories-info">
            Search members
          </div>
        </button>
        
        <button class="categories-card">
          <span class="search-icon material-symbols-outlined">
            description
          </span>
          <div class="categories-names">
            PAGES
          </div>
          <div class="categories-info">
            Search pages
          </div>
      </div>
      </button>
      
    </div>
    
     <div class="search-instruction">
   <span class="search-icon material-symbols-outlined">
     local_fire_department
   </span>
   <p>POPULAR SEARCHES</p>
 </div>
    <div class="container-porpular-search">
      <div class="searches-container">
        <button class="popular-scr-card">
          Africa union
        </button>
        <button class="popular-scr-card">
          alliance war
        </button>
        <button class="popular-scr-card">
          Steel production 
        </button>
        <button class="popular-scr-card">
          treaty 
        </button>
        <button class="popular-scr-card">
          dashboard 
        </button>
        <button class="popular-scr-card">
          help 
        </button>
      </div>
      
    </div>
    
    <!-- overlay -->
    
    <div class="overlay js-overlay"></div>
    
    <!-- sidebar -->
    
    <div class="sidebar js-sidebar">
      
      <div class="sidebar-header">
        
        <div>
          <img src="images/BHOS-log.png" alt="logo" class="logo-sidebar-image" />
        </div>
        
        <div class="alliance-sidebar-name">
          <div class="name-guard"></div>
          <p>BHOS</p>
          <div class="name-guard"></div>
        </div>
        
      </div>
      
      <div class="sidesbar-nav">
        
        <div class="nav-btn-conatiner">
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              dashboard
            </span>
            Dashboard
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              groups
            </span>
            Member
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              flag
            </span>
            Nation
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              swords
            </span>
            Alliance War
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              account_balance
            </span>
            Alliance Council
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              chat
            </span>
            Chats
          </button>
          
          <button class="nav-btn">
            <span class=" icon-style material-symbols-outlined">
              analytics
            </span>
            Alliance Statistics
          </button>
          
          <button class="nav-btn">
            <span class=" icon-style material-symbols-outlined">
              settings
            </span>
            Settings
          </button>
          
          <button class="nav-btn">
            <span class=" icon-style material-symbols-outlined">
              info
            </span>
            About/help
          </button>
          
        </div>
        
      </div>
      
      
    </div>
  </main>
  
  
  
  <footer>
    
    <div class="footer-content">
      
      
      <div class="right-footer-section">
        
        <div class="logo-footer-img">
          
          <img src="images/BHOS-log.png" alt="logo">
          
        </div>
        
        <p class="quoted">
          Strength in unity. victory through steel.
        </p>
        
      </div>
      
      
      <div class="left-footer-section">
        © 2026 BROTHERHOOD OF STEEL
      </div>
      
      
    </div>
    
  </footer>
  
  <script type="module" src="scripts/dashboard/dashboard.js"></script>
</body>

</html>
