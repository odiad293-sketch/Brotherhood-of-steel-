<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="styles/auth.css">
  <link rel="stylesheet" href="styles/general.css">
  
  <title>signUp</title>
</head>

<body>
  
  <header>
    <div class="main-header-container">
      <div class="bhos-logo-container">
        <img class="bhos-logo" src="images/BHOS-log.png" alt="logo" />
      </div>
      
      <div class="bhos-image-writeup">
        <img src="images/BHOS-write-up.png" alt="logo write-up" />
      </div>
      
      <div class="second-write-up">
        <p class="write-Up">STRENGTH IN UNITY.</p>
        <p class="write-Up">VICTORY THROUGH STEEL.</p>
        <p class="bhos-promise">join the brotherhood of steel and stand with allies who fight for honor, loyalty, and dominion in politics & war.</p>
      </div>
      
    </div>
    
  </header>
  
  <div class="overlay">
    <div class="loading-state">
      <img class="bhos-logo-loading" src="images/BHOS-log.png" alt="logo" />
      <div class="loading-writeup">Loading...</div>
    </div>
  </div>
  
  <main>
    <p class="loading-message">Loading your application…
      Please wait a moment. If the page doesn’t load, check your internet connection and try again.
    </p>
  </main>
  <script type="module" src="/BHOS /scripts/auth/sign-up.js"></script>
</body>

</html>
