<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Search Results</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="styles/dashboard/sidebar.css">
   <link rel="stylesheet" href="styles/dashboard/updates.css">
  <link rel="stylesheet" href="styles/dashboard/header.css">
  <link rel="stylesheet" href="styles/search/search-results.css">
</head>

<body>
  
  <!-- Header -->
  <header>
    
    <div class="left-component">
      
      <button class="icon-container js-sidebar-btn">
        <span class=" js-sidebar-icon red-icons material-symbols-outlined">
          menu
        </span>
      </button>
      
      <div class="logo-container">
        
        <img src="images/BHOS-log.png" alt="logo" class="logo-image" />
        
        <div class="alliance-name">
          <p>BROTHERHOOD OF STEEL</p>
        </div>
        
      </div>
      
    </div>
    
    
    <div class="right-component">
      
      <button class="icon-container notification-container">
      
        <span class="White-icons material-symbols-outlined">
          notifications
        </span>
        
        <div class="notification-badge">
          3
        </div>
        
      </button>
      
    </div>
    
  </header>
  
  <!-- Main Search Results -->
  <main class="search-results-page">
    
    <!-- Search Results Heading -->
    <section class="results-heading">
      
      <button class="back-button">
        <span class="material-symbols-outlined">
          arrow_back
        </span>
      </button>
      
      <h1>SEARCH RESULTS</h1>
      
      <button class="clear-button">
        Clear
      </button>
      
    </section>
    
    
    <!-- Search Bar -->
    <section class="results-search-container">
      
      <span class="material-symbols-outlined search-input-icon">
        search
      </span>
      
      <input class="results-search-input" type="text"  placeholder="Search the alliance...">
      
      <button class="search-clear-button">
        <span class="material-symbols-outlined">
          close
        </span>
      </button>
      
    </section>
    
    
    <!-- Search Categories -->
    <nav class="search-category-tabs">
      
      <button class="search-category-tab active">
        ALL <span>(12)</span>
      </button>
      
      <button class="search-category-tab">
        NATIONS <span>(3)</span>
      </button>
      
      <button class="search-category-tab">
        MEMBERS <span>(6)</span>
      </button>
      
      <button class="search-category-tab">
        PAGES <span>(3)</span>
      </button>
      
    </nav>
    
    
    <!-- Nations -->
    <section class="result-section">
      
      <div class="result-section-header">
        
        <div class="result-section-title">
          
          <span class="material-symbols-outlined nation-section-icon">
            language
          </span>
          
          <h2>NATIONS <span>(3)</span></h2>
          
        </div>
        
        <button class="view-all-button">
          View all
        </button>
        
      </div>
      
      
      <div class="result-list">
        
        <!-- Nation 1 -->
        <button class="result-card nation-card">
        
          <div class="nation-icon">
            <span class="material-symbols-outlined">
              public
            </span>
          </div>
          
          <div class="result-card-information">
            
            <h3>Odia Federation</h3>
            
            <p>
              Leader:
              <strong>Mave Odia</strong>
            </p>
            
            <div class="result-meta">
              <span>Cities: 8</span>
              <span>|</span>
              <span>Score: 7,812</span>
            </div>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
        
        <!-- Nation 2 -->
        <button class="result-card nation-card">
        
          <div class="nation-icon">
            <span class="material-symbols-outlined">
              flag
            </span>
          </div>
          
          <div class="result-card-information">
            
            <h3>Odia Dominion</h3>
            
            <p>
              Leader:
              <strong>Odia Supreme</strong>
            </p>
            
            <div class="result-meta">
              <span>Cities: 5</span>
              <span>|</span>
              <span>Score: 6,245</span>
            </div>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
        
        <!-- Nation 3 -->
        <button class="result-card nation-card">
        
          <div class="nation-icon">
            <span class="material-symbols-outlined">
              shield
            </span>
          </div>
          
          <div class="result-card-information">
            
            <h3>Kingdom of Odia</h3>
            
            <p>
              Leader:
              <strong>King Odia I</strong>
            </p>
            
            <div class="result-meta">
              <span>Cities: 3</span>
              <span>|</span>
              <span>Score: 4,312</span>
            </div>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
      </div>
      
    </section>
    
    
    <!-- Members -->
    <section class="result-section">
      
      <div class="result-section-header">
        
        <div class="result-section-title">
          
          <span class="material-symbols-outlined member-section-icon">
            groups
          </span>
          
          <h2>MEMBERS <span>(6)</span></h2>
          
        </div>
        
        <button class="view-all-button">
          View all
        </button>
        
      </div>
      
      
      <div class="result-list">
        
        <!-- Member 1 -->
        <button class="result-card member-card">
        
          <div class="member-avatar">
            
            <img src="images/BHOS-log.png" alt="BHOSmember">
            
            <span class="online-indicator"></span>
            
          </div>
          
          <div class="result-card-information">
            
            <h3>Odia Etiosa</h3>
            
            <p class="member-rank">
              <span class="material-symbols-outlined">
                shield
              </span>
              Knight
            </p>
            
            <p class="member-status">
              Active now
            </p>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
        
        <!-- Member 2 -->
        <button class="result-card member-card">
        
          <div class="member-avatar">
            
            <img src="images/BHOS-log.png" alt="BHOSmember">
            
            <span class="online-indicator"></span>
            
          </div>
          
          <div class="result-card-information">
            
            <h3>Odia Prime</h3>
            
            <p class="member-rank">
              Council Member
            </p>
            
            <p class="member-status">
              Last active 1h ago
            </p>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
        
        <!-- Member 3 -->
        <button class="result-card member-card">
        
          <div class="member-avatar">
            
            <img src="images/BHOS-log.png" alt="BHOSmember">
            
            <span class="online-indicator"></span>
            
          </div>
          
          <div class="result-card-information">
            
            <h3>Odia Warrior</h3>
            
            <p class="member-rank">
              Soldier
            </p>
            
            <p class="member-status">
              Last active 3h ago
            </p>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
      </div>
      
    </section>
    
    
    <!-- Pages -->
    <section class="result-section">
      
      <div class="result-section-header">
        
        <div class="result-section-title">
          
          <span class="material-symbols-outlined page-section-icon">
            description
          </span>
          
          <h2>PAGES <span>(3)</span></h2>
          
        </div>
        
        <button class="view-all-button">
          View all
        </button>
        
      </div>
      
      
      <div class="result-list">
        
        <!-- Page 1 -->
        <button class="result-card page-card">
        
          <div class="page-icon">
            <span class="material-symbols-outlined">
              settings
            </span>
          </div>
          
          <div class="result-card-information">
            
            <h3>Odia Projects</h3>
            
            <p>
              Alliance Projects
            </p>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
        
        <!-- Page 2 -->
        <button class="result-card page-card">
        
          <div class="page-icon">
            <span class="material-symbols-outlined">
              swords
            </span>
          </div>
          
          <div class="result-card-information">
            
            <h3>Odia War Reports</h3>
            
            <p>
              Alliance Wars
            </p>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
        
        <!-- Page 3 -->
        <button class="result-card page-card">
        
          <div class="page-icon">
            <span class="material-symbols-outlined">
              account_balance
            </span>
          </div>
          
          <div class="result-card-information">
            
            <h3>Odia Council Chamber</h3>
            
            <p>
              Alliance Council
            </p>
            
          </div>
          
          <span class="material-symbols-outlined result-arrow">
            chevron_right
          </span>
          
        </button>
        
      </div>
      
    </section>
    
    
       <!-- overlay -->
    
    <div class="overlay js-overlay"></div>
    
    <!-- sidebar -->
    
    <div class="sidebar js-sidebar">
      
      <div class="sidebar-header">
        
        <div>
          <img src="images/BHOS-log.png" alt="logo" class="logo-sidebar-image" />
        </div>
        
        <div class="alliance-sidebar-name">
          <div class="name-guard"></div>
          <p>BHOS</p>
          <div class="name-guard"></div>
        </div>
        
      </div>
      
      <div class="sidesbar-nav">
        
        <div class="nav-btn-conatiner">
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              dashboard
            </span>
            Dashboard
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              groups
            </span>
            Member
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              flag
            </span>
            Nation
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              swords
            </span>
            Alliance War
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              account_balance
            </span>
            Alliance Council
          </button>
          
          <button class="nav-btn">
            <span class="icon-style material-symbols-outlined">
              chat
            </span>
            Chats
          </button>
          
          <button class="nav-btn">
            <span class=" icon-style material-symbols-outlined">
              analytics
            </span>
            Alliance Statistics
          </button>
          
          <button class="nav-btn">
            <span class=" icon-style material-symbols-outlined">
              settings
            </span>
            Settings
          </button>
          
          <button class="nav-btn">
            <span class=" icon-style material-symbols-outlined">
              info
            </span>
            About/help
          </button>
          
        </div>
        
      </div>
      
      
    </div>
    
  </main>
  
  <footer>
    
    <div class="footer-content">
      
      
      <div class="right-footer-section">
        
        <div class="logo-footer-img">
          
          <img src="images/BHOS-log.png" alt="logo">
          
        </div>
        
        <p class="quoted">
          Strength in unity. victory through steel.
        </p>
        
      </div>
      
      
      <div class="left-footer-section">
        © 2026 BROTHERHOOD OF STEEL
      </div>
      
      
    </div>
    
  </footer>
    <script type="module" src="scripts/dashboard/dashboard.js"></script>
</body>

</html>
